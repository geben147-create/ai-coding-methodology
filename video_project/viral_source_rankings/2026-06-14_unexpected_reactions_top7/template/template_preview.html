<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unexpected Reactions TOP7 Template</title>
  <style>
    :root {
      --yellow: #ffd735;
      --white: #fffdf6;
      --red: #ff3b30;
      --ink: #080a0a;
      --muted: #b8b9b4;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      background: #050707;
      color: var(--white);
      font-family: "Bahnschrift", "Malgun Gothic", sans-serif;
    }

    .canvas {
      position: relative;
      width: 1080px;
      height: 1920px;
      isolation: isolate;
      background:
        radial-gradient(circle at 82% 12%, rgba(255, 215, 53, 0.16), transparent 28%),
        radial-gradient(circle at 12% 78%, rgba(255, 59, 48, 0.13), transparent 26%),
        linear-gradient(145deg, #101414 0%, #050707 52%, #11100c 100%);
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, #000, transparent 72%);
    }

    header {
      position: absolute;
      top: 68px;
      left: 72px;
      right: 72px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--yellow);
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -.055em;
      line-height: .98;
      text-shadow: 0 8px 26px rgba(0, 0, 0, .48);
    }

    .top-label {
      margin-top: 8px;
      padding: 15px 22px 13px;
      border: 2px solid rgba(255,255,255,.5);
      border-radius: 999px;
      background: rgba(4,6,6,.68);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -.04em;
      backdrop-filter: blur(18px);
    }

    .video-frame {
      position: absolute;
      top: 276px;
      left: 42px;
      width: 996px;
      height: 1320px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.19);
      border-radius: 42px;
      box-shadow: 0 40px 110px rgba(0,0,0,.6);
      background:
        linear-gradient(155deg, rgba(255,215,53,.16), transparent 30%),
        linear-gradient(20deg, #2b3735, #121818 48%, #382f23);
    }

    .video-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 64% 35%, rgba(255,244,198,.28), transparent 18%),
        radial-gradient(circle at 48% 53%, rgba(255,255,255,.14), transparent 22%),
        linear-gradient(120deg, transparent 0 42%, rgba(255,255,255,.08) 42% 44%, transparent 44%);
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.42);
      font-size: 44px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .rank-stack {
      position: absolute;
      top: 424px;
      left: 60px;
      z-index: 3;
      display: grid;
      gap: 15px;
      padding: 22px 17px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: rgba(5,7,7,.68);
      box-shadow: 0 18px 48px rgba(0,0,0,.34);
      backdrop-filter: blur(14px);
    }

    .rank {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border-radius: 50%;
      color: rgba(255,255,255,.72);
      font-size: 34px;
      font-weight: 900;
    }

    .rank.current {
      color: #fff;
      background: var(--red);
      box-shadow: 0 0 0 8px rgba(255,59,48,.18), 0 12px 28px rgba(255,59,48,.34);
      transform: scale(1.15);
    }

    .reaction {
      position: absolute;
      left: 132px;
      right: 132px;
      bottom: 300px;
      z-index: 4;
      padding: 30px 36px 34px;
      border-radius: 28px;
      color: var(--white);
      background: rgba(3,5,5,.82);
      box-shadow: 0 18px 55px rgba(0,0,0,.5);
      font-size: 70px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -.055em;
      text-align: center;
    }

    .reaction strong { color: var(--yellow); }

    .character-guide {
      position: absolute;
      right: 70px;
      bottom: 490px;
      z-index: 5;
      width: 300px;
      height: 420px;
      display: grid;
      place-items: center;
      border: 3px dashed rgba(255,215,53,.62);
      border-radius: 46% 46% 24% 24%;
      color: var(--yellow);
      background: linear-gradient(180deg, rgba(255,215,53,.08), rgba(255,215,53,.02));
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      opacity: .8;
    }

    footer {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 26px;
      border-top: 2px solid rgba(255,255,255,.18);
      color: var(--muted);
      font-size: 32px;
      font-weight: 700;
    }

    .cta { color: var(--white); }
  </style>
</head>
<body>
  <main class="canvas" aria-label="1080x1920 쇼츠 템플릿">
    <header>
      <div>
        <p class="eyebrow">Unexpected moment archive</p>
        <h1>예상 못한 리액션</h1>
      </div>
      <div class="top-label">랭킹 TOP7</div>
    </header>

    <section class="video-frame" aria-label="중앙 영상 프레임">
      <div class="video-placeholder">VIDEO / IMAGE FRAME</div>
    </section>

    <nav class="rank-stack" aria-label="순위 목록">
      <span class="rank current">1</span>
      <span class="rank">2</span>
      <span class="rank">3</span>
      <span class="rank">4</span>
      <span class="rank">5</span>
      <span class="rank">6</span>
      <span class="rank">7</span>
    </nav>

    <div class="reaction">표정이 <strong>한 번에</strong> 풀렸다</div>
    <aside class="character-guide">CHARACTER PNG<br>SAFE AREA<br>opacity 80%</aside>

    <footer>
      <span>source attribution safe zone</span>
      <span class="cta">다음 반응은 더 놀랍습니다</span>
    </footer>
  </main>
</body>
</html>
