<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRUSTA — 대시보드</title>
<link rel="stylesheet" href="design-system/colors_and_type.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="page" style="min-height: 100vh; display: flex; flex-direction: column;">

  <div class="topbar">
    <span>K-뷰티 해외 콘텐츠 RegTech SaaS</span>
    <span class="dot">●</span>
    <span class="accent" id="trial-badge">무료체험 중</span>
  </div>

  <section class="center" style="padding-bottom: var(--s-40);">
    <div class="pill lg">TRUSTA</div>
    <h1 class="h-hero" style="margin-top: 28px;" id="welcome-msg">안녕하세요.</h1>
  </section>

  <section style="padding-top: 0; flex: 1;">

    <!-- 체험 상태 카드 -->
    <div class="card" style="margin-bottom: 24px;" id="trial-card">
      <span class="plus">+</span>
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
        <div style="flex: 1; min-width: 200px;">
          <h3 class="h-card" id="trial-title">무료체험 진행 중</h3>
          <p class="text-2 small" style="margin-top: 6px;" id="trial-desc">남은 기간을 확인하세요.</p>
        </div>
        <div class="score-card" style="flex: 0 0 auto; min-width: 120px; text-align: center;">
          <div class="label">D-DAY</div>
          <div class="value" id="trial-days-left" style="font-size: 40px;">—</div>
        </div>
      </div>
    </div>

    <!-- 안내 카드 -->
    <div class="card" style="margin-bottom: 24px;">
      <span class="plus">+</span>
      <h3 class="h-card">문구 점검 서비스</h3>
      <p class="text-2" style="margin-top: 10px; line-height: 1.65;">
        현재 베타 서비스를 준비 중입니다.<br />
        무료체험 기간 동안 <b>샘플 진단 신청</b>을 통해 먼저 이용해 보세요.
      </p>
      <a href="signup-flow/signup.html" class="cta" style="margin-top: 20px;">
        샘플 진단 신청하기 <span class="arrow">→</span>
      </a>
    </div>

    <!-- 로그아웃 -->
    <button class="cta ghost" id="logout-btn" style="margin-top: 12px;">
      로그아웃 <span class="arrow" style="color: var(--yellow-edge);">→</span>
    </button>
  </section>

  <footer style="background: #0a0a0a; color: var(--ink-4); padding: 36px 32px; text-align: center; font-size: 12px; line-height: 1.7;">
    <div style="color: var(--yellow); font-family: var(--font-display); font-weight: 900; font-size: 18px; letter-spacing: 0.04em;">TRUSTA</div>
    <p style="margin-top: 12px;">
      K-뷰티 브랜드의 해외 콘텐츠 문장 안전망<br />
      K-Beauty Overseas Content RegTech SaaS
    </p>
    <p style="margin-top: 16px; color: #555; font-size: 11px;">© 2026 TRUSTA.</p>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="signup-flow/config.js"></script>
<script src="auth-check.js"></script>
<script>
(async () => {
  const result = await initAuthCheck();
  if (!result) return; // redirected

  const { sb, session, profile } = result;

  // 인사 메시지
  const emailLocal = (session.user.email || '').split('@')[0];
  document.getElementById('welcome-msg').textContent =
    '안녕하세요, ' + emailLocal + '님.';

  // 남은 일수 계산
  const now = new Date();
  const ends = new Date(profile.trial_ends_at);
  const daysLeft = Math.max(0, Math.ceil((ends - now) / (1000 * 60 * 60 * 24)));

  document.getElementById('trial-days-left').textContent = daysLeft;
  document.getElementById('trial-desc').textContent =
    '무료체험이 ' + ends.toLocaleDateString('ko-KR') + '에 종료됩니다.';

  if (daysLeft === 0) {
    document.getElementById('trial-title').textContent = '오늘 무료체험이 종료됩니다';
    document.getElementById('trial-badge').textContent = '만료 D-0';
  } else if (daysLeft === 1) {
    document.getElementById('trial-badge').textContent = '체험 D-1';
  }

  // 로그아웃
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });
})();
</script>
</body>
</html>
